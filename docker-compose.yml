version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: agrimart-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://frontend:3000
      - REVALIDATION_SECRET=agrimart_secret_reval_2026
      - RAZORPAY_KEY_ID=rzp_test_1DP5mmOlF5G5ag
      - RAZORPAY_KEY_SECRET=rzp_test_secret_mock
    volumes:
      - backend-data:/app/apps/backend/data
    restart: unless-stopped
    networks:
      - agrimart-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: agrimart-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3001
      - BACKEND_INTERNAL_URL=http://backend:3001
      - REVALIDATION_SECRET=agrimart_secret_reval_2026
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_test_1DP5mmOlF5G5ag
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - agrimart-network

volumes:
  backend-data:

networks:
  agrimart-network:
    driver: bridge
